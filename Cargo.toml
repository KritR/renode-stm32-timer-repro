[package]
name = "tickrepro"
version = "0.1.0"
edition = "2024"

[dependencies]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy.git", rev = "e5921a9d3a4a138f724ea40662599ff0fc42e6c7", features = ["stm32g474ce", "dual-bank", "time-driver-tim15", "memory-x"] }
embassy-executor = { git = "https://github.com/embassy-rs/embassy.git", rev = "e5921a9d3a4a138f724ea40662599ff0fc42e6c7", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { git = "https://github.com/embassy-rs/embassy.git", rev = "e5921a9d3a4a138f724ea40662599ff0fc42e6c7", features = ["tick-hz-32_768"] }
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.0"

[profile.release]
debug = true
